<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio Admin | NMB</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body class="admin-body"><header class="nav admin-nav"><a class="logo" href="index.html">NMB<span>.</span></a><div class="admin-nav-actions"><a href="index.html">View site ↗</a><button id="logout-btn" class="ghost-btn" hidden>Sign out</button></div></header><main class="admin-shell">
<section id="login-view" class="admin-auth"><div class="admin-card"><div class="section-head"><span>ADMIN</span><p>SECURE ACCESS</p></div><h1 class="admin-title">Portfolio<br><strong>Dashboard</strong></h1><p class="admin-muted">Sign in with the administrator account created in Supabase Auth.</p><form id="login-form" class="admin-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-primary" type="submit">Sign in</button><p id="login-status" class="form-status"></p></form></div></section>
<section id="dashboard-view" hidden><div class="admin-heading"><div><div class="section-head"><span>ADMIN</span><p>DASHBOARD</p></div><h2>Manage your portfolio.</h2></div><p id="admin-email" class="admin-muted"></p></div><div class="admin-stats"><article><small>MESSAGES</small><strong id="message-count">—</strong></article><article><small>PROJECTS</small><strong id="project-count">—</strong></article><article><small>PUBLISHED</small><strong id="published-count">—</strong></article></div>
<div class="admin-layout"><section class="admin-panel"><div class="panel-head"><div><span>01</span><h3>Messages</h3></div><button id="refresh-messages" class="ghost-btn">Refresh</button></div><div id="messages-list" class="message-list"></div></section>
<section class="admin-panel"><div class="panel-head"><div><span>02</span><h3>Projects</h3></div><button id="new-project-btn" class="ghost-btn">+ New project</button></div><div id="projects-list" class="admin-project-list"></div></section></div>
<section class="admin-panel project-editor"><div class="panel-head"><div><span>03</span><h3 id="editor-title">Add project</h3></div><button id="cancel-edit-btn" class="ghost-btn" type="button">Clear</button></div><form id="project-form" class="admin-form two-col"><input type="hidden" name="id"><label>Title<input name="title" required></label><label>Year<input name="year" type="number" min="2000" max="2100" required></label><label class="full">Description<textarea name="description" rows="5" required></textarea></label><label class="full">Technologies <small>Comma separated</small><input name="technologies" placeholder="PCB Design, Gate Driver, EMI/EMC"></label><label>Sort order<input name="sort_order" type="number" value="100"></label><label class="check-label"><input name="published" type="checkbox" checked> Publish on website</label><label>Cover image<input name="cover" type="file" accept="image/*"></label><label>Gallery images<input name="gallery" type="file" accept="image/*" multiple></label><div class="full current-media" id="current-media"></div><div class="full editor-actions"><button class="btn btn-primary" type="submit">Save project</button><p id="project-status" class="form-status"></p></div></form></section></section></main><script type="module" src="admin.js"></script></body></html>
